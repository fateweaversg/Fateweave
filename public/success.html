<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment — FateWeave 天机汇</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><section class="card" style="text-align:center"><h1 id="heading">Checking your payment…</h1><p id="status">Please wait — we are verifying your payment with Stripe.</p><p id="actions" class="hidden"><a href="/"><button type="button">See my full reading →</button></a></p></section></main>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const sessionId = params.get('session_id');
  const status = document.getElementById('status');
  const heading = document.getElementById('heading');
  const actions = document.getElementById('actions');
  const goHome = (ms) => { actions.classList.remove('hidden'); setTimeout(() => { location.href = '/'; }, ms); };
  if (!sessionId) { status.textContent = 'No checkout session found.'; goHome(4000); return; }
  try {
    const res = await fetch('/api/checkout-session/' + encodeURIComponent(sessionId));
    const data = await res.json();
    if (!res.ok) { status.textContent = data.error || 'Payment could not be verified yet.'; goHome(5000); return; }
    if (data.upgrade) {
      // Unlimited Master Chat upgrade: no new token — the buyer already
      // holds one. The server (and webhook) granted the unlimited flag.
      // Keep ?upgraded=1&session_id=… on the redirect: the hub confirms
      // the upgrade on the server and flips the counter to Unlimited.
      // (A plain '/' redirect would drop those params and the hub could
      // never tell the upgrade had happened.)
      heading.textContent = '✓ Unlimited Master Chat unlocked';
      status.textContent = 'Ask the Master as many times as you like, for the same 90 days as your reading. Taking you back to your reading now…';
      actions.classList.remove('hidden');
      setTimeout(() => { location.href = '/?upgraded=1&session_id=' + encodeURIComponent(sessionId); }, 2200);
      return;
    }
    if (data.token) {
      // Fresh token (or first issue) — always stored, then straight to the reading.
      localStorage.setItem('fateweave_token', data.token);
      localStorage.setItem('fateweave_email', data.email);
      localStorage.setItem('fateweave_birthDate', data.birthDate);
      // The token is bound to this birth date: remember it, so going back
      // to this date after peeking at another one restores the paid reading.
      localStorage.setItem('fateweave_tokenBirthDate', data.birthDate);
      heading.textContent = '✓ Payment confirmed — your reading is unlocked';
      // Do NOT promise the report email here: with the Resend sandbox
      // sender it only delivers to the Resend account owner's own email,
      // so a buyer on another address may never get it. The reading is
      // open below regardless, and Download my report on the unlocked
      // page always works.
      status.textContent = 'Your full reading is open. Your detailed report was emailed to ' + data.email + ' — if it never arrives, use Download my report on the unlocked page. Taking you there now…';
      goHome(2200);
    } else if (localStorage.getItem('fateweave_token')) {
      // Server could not issue a new token, but this device already holds one.
      heading.textContent = '✓ Payment confirmed';
      status.textContent = 'Your reading is already unlocked on this device. Taking you there now…';
      goHome(2200);
    } else {
      heading.textContent = 'Payment confirmed';
      status.textContent = (data.message || 'Payment confirmed. Check your email for your report link.') + ' Tap below to open your reading.';
      goHome(6000);
    }
  } catch (e) {
    status.textContent = 'Could not verify payment: ' + e.message + ' — please tap below to try your reading.';
    goHome(6000);
  }
})();
</script>
</body>
</html>
